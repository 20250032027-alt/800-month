<style>
/* ===== Colour scheme: change these to re-theme the whole site ===== */
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --sand:#F4F0E8; --sand-2:#E9E3D8;
  --ink:#1C2333; --ink-2:#3E4656; --muted:#667085; --line:#E7E2D8; --line-2:#D3CCBE;
  --gold:#B48A4C; --gold-ink:#8A6631; --gold-soft:#F3EADB;
  --navy:#1F2D4A; --navy-ink:#F5F2EC; --navy-muted:#C3CBDA; --navy-soft:#E5E9F1;
  --sage:#3F6B57; --sage-soft:#E3EEE8;
  --warn:#94570F; --warn-soft:#FCEFD9; --bad:#A33A2C; --bad-soft:#F9E5E1;
  --btn-bg:#1F2D4A; --btn-fg:#FFFFFF; --btn-hover:#16213A;
  --footer:#1A2540; --footer-base:#121A2E;
  --shadow:0 20px 44px -26px rgba(28,35,51,.38);
  --shadow-sm:0 6px 18px -10px rgba(28,35,51,.3);
  --r-sm:10px; --r:16px; --r-lg:24px;
  --display:"Jost","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --script:"Caveat","Segoe Script","Bradley Hand",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161F; --surface:#1A1F2B; --sand:#1D2330; --sand-2:#262D3B;
    --ink:#EEF0F4; --ink-2:#CDD2DC; --muted:#9AA3B2; --line:#2C3342; --line-2:#3B4354;
    --gold:#CDA769; --gold-ink:#DDBD83; --gold-soft:#2A2518;
    --navy:#151C2C; --navy-ink:#EEF0F4; --navy-muted:#B5BFD0; --navy-soft:#1C2638;
    --sage:#8FC3A7; --sage-soft:#1A2A23;
    --warn:#E8B068; --warn-soft:#33281A; --bad:#EF8C7E; --bad-soft:#3A221E;
    --btn-bg:#DDBD83; --btn-fg:#161B26; --btn-hover:#E8CB95;
    --footer:#0F1420; --footer-base:#0A0E17;
    --shadow:0 20px 44px -26px rgba(0,0,0,.7); --shadow-sm:0 6px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#12161F; --surface:#1A1F2B; --sand:#1D2330; --sand-2:#262D3B;
    --ink:#EEF0F4; --ink-2:#CDD2DC; --muted:#9AA3B2; --line:#2C3342; --line-2:#3B4354;
    --gold:#CDA769; --gold-ink:#DDBD83; --gold-soft:#2A2518;
    --navy:#151C2C; --navy-ink:#EEF0F4; --navy-muted:#B5BFD0; --navy-soft:#1C2638;
    --sage:#8FC3A7; --sage-soft:#1A2A23;
    --warn:#E8B068; --warn-soft:#33281A; --bad:#EF8C7E; --bad-soft:#3A221E;
    --btn-bg:#DDBD83; --btn-fg:#161B26; --btn-hover:#E8CB95;
    --footer:#0F1420; --footer-base:#0A0E17;
    --shadow:0 20px 44px -26px rgba(0,0,0,.7); --shadow-sm:0 6px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
img,svg{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:28px;padding-right:28px}
@media (max-width:640px){.wrap{padding-left:18px;padding-right:18px}}

/* ===== motion ===== */
#app{transition:opacity .22s ease}
#app.leaving{opacity:0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.rv.dl1{transition-delay:.08s}.rv.dl2{transition-delay:.16s}.rv.dl3{transition-delay:.24s}
.stars{display:inline-flex;gap:2px;vertical-align:-2px}
.fadeswap{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== type ===== */
.display{font-family:var(--display);font-weight:400;letter-spacing:-.005em;line-height:1.1;margin:0;color:var(--ink)}
.d1{font-size:clamp(2.4rem,5.2vw,4.1rem);font-weight:300}
.d2{font-size:clamp(1.9rem,3.6vw,2.8rem)}
.d3{font-size:clamp(1.35rem,2.2vw,1.7rem)}
.kicker{font-family:var(--display);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 14px;font-weight:500}
.lede{font-size:1.07rem;color:var(--ink-2);max-width:60ch}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.tiny{font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0}
.script{font-family:var(--script);font-size:2.2rem;line-height:1;color:var(--gold-ink)}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border:1px solid transparent;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;font-size:.97rem;text-decoration:none;cursor:pointer;transition:background .2s,transform .12s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--btn-hover);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold-ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--gold);background:var(--gold-soft);box-shadow:none}
.btn.light{background:#FBF9F5;color:#1C2333}
.btn.light:hover{background:#FFFFFF}
.btn.glass{background:rgba(255,253,249,.14);color:#FBF9F5;border-color:rgba(255,253,249,.55);backdrop-filter:blur(6px)}
.btn.glass:hover{background:rgba(255,253,249,.24)}
.btn.sm{min-height:40px;padding:0 16px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:26px;height:26px}
.star{width:15px;height:15px;fill:currentColor;stroke:none}

/* ===== photos and placeholders ===== */
.ph{position:relative;overflow:hidden;background:var(--sand-2) center/cover no-repeat;border-radius:var(--r)}
.ph.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:repeating-linear-gradient(135deg,var(--sand) 0 14px,var(--sand-2) 14px 15px);border:1.5px dashed var(--line-2);color:var(--muted);text-align:center;padding:16px}
.ph.empty b{font-family:var(--display);font-weight:500;letter-spacing:.18em;font-size:.82rem;color:var(--ink-2)}
.ph.empty span{font-size:.78rem}
.ph .tag{position:absolute;left:12px;bottom:12px;background:rgba(255,253,249,.92);color:#1C2333;font-size:.75rem;font-weight:600;padding:5px 11px;border-radius:999px}

/* ===== demo strip ===== */
.ribbon{background:var(--navy);color:var(--navy-ink);font-size:.84rem}
.ribbon .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.ribbon .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E3C88B;margin-right:9px;vertical-align:middle;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;border:1px solid rgba(244,241,234,.3);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 14px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;min-height:32px}
.seg button[aria-pressed="true"]{background:#F5F2EC;color:#1F2D4A}
@media (max-width:640px){.ribbon{font-size:.76rem}}

/* ===== header ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.hdr.scrolled{border-color:var(--line);box-shadow:0 8px 24px -22px rgba(0,0,0,.4)}
.hdr .wrap{display:flex;align-items:center;gap:28px;min-height:80px}
.brand{display:flex;flex-direction:column;line-height:1.05;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:500;font-size:1.28rem;letter-spacing:.06em}
.brand span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:flex;gap:6px;margin-left:auto}
.nav a{font-size:.95rem;font-weight:500;text-decoration:none;color:var(--ink-2);padding:8px 14px;border-radius:999px;transition:background .2s,color .2s}
.nav a:hover{background:var(--sand)}
.nav a[aria-current="page"]{background:var(--gold-soft);color:var(--gold-ink)}
.burger{display:none;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:46px;height:46px;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
@media (max-width:1000px){.nav,.hdr .btn.book{display:none}.burger{display:inline-flex}.hdr .wrap{min-height:68px}}
.mnav{position:fixed;inset:0;z-index:70;background:var(--surface);padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .3s cubic-bezier(.16,1,.3,1),visibility 0s .3s;visibility:hidden}
.mnav.open{opacity:1;transform:none;visibility:visible;transition:opacity .25s,transform .3s cubic-bezier(.16,1,.3,1)}
.mnav a.item{font-family:var(--display);font-size:1.7rem;color:var(--ink);text-decoration:none;padding:14px 4px;border-bottom:1px solid var(--line)}

/* ===== hero ===== */
.hero{position:relative;min-height:min(88vh,780px);display:flex;align-items:flex-end;color:#FBF9F5;overflow:hidden;isolation:isolate;background:#2A251F}
.slides{position:absolute;inset:0;z-index:-2}
.slide{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06)}
.slide.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(16,22,36,.7) 0%,rgba(16,22,36,.38) 50%,rgba(16,22,36,.05) 80%),linear-gradient(0deg,rgba(16,22,36,.6) 0%,rgba(16,22,36,0) 45%)}
@media (max-width:760px){.hero::after{background:linear-gradient(0deg,rgba(16,22,36,.82) 0%,rgba(16,22,36,.5) 60%,rgba(16,22,36,.3) 100%)}}
.hero .copy{padding:120px 0 150px;max-width:640px}
@media (max-width:760px){.hero .copy{padding:90px 0 120px}}
.hero .kicker{color:#E3CDA2}
.hero h1{color:#FBF9F5}
.hero .lede{color:#F0E9DC;margin-top:20px}
.hero .ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.rating-chip{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:8px 16px 8px 12px;border-radius:999px;background:rgba(255,253,249,.14);border:1px solid rgba(255,253,249,.3);backdrop-filter:blur(6px);font-size:.92rem}
.rating-chip .stars{display:flex;gap:2px;color:#E3C48C}
.sdots{position:absolute;right:28px;bottom:120px;display:flex;gap:4px;z-index:2}
.sdots button{width:34px;height:34px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.sdots button::before{content:"";width:22px;height:3px;border-radius:3px;background:rgba(255,253,249,.4);transition:background .3s}
.sdots button[aria-current="true"]::before{background:#FBF9F5}
@media (max-width:760px){.sdots{bottom:90px;right:12px}}
.hero-in>*{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
.hero-in>*:nth-child(2){animation-delay:.1s}.hero-in>*:nth-child(3){animation-delay:.2s}.hero-in>*:nth-child(4){animation-delay:.3s}.hero-in>*:nth-child(5){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}

/* ===== booking bar ===== */
.bbar{position:relative;z-index:5;margin-top:-58px}
.bbar form{display:grid;grid-template-columns:1.3fr 1fr 1fr .9fr auto;align-items:stretch;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;gap:4px}
.bbar .f{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:10px 18px;border-radius:var(--r);min-height:68px;text-align:left;background:none;border:0;cursor:pointer;transition:background .2s}
.bbar .f+.f{box-shadow:-1px 0 0 var(--line)}
.bbar .f:hover{background:var(--sand);box-shadow:none}
.bbar .lab{font-size:.74rem;font-weight:700;color:var(--muted)}
.bbar .val{font-weight:600;font-size:1rem;color:var(--ink)}
.bbar select{border:0;background:transparent;font-weight:600;padding:0;cursor:pointer;font-size:1rem}
.bbar .btn{min-height:auto;align-self:stretch;padding:0 30px}
@media (max-width:900px){.bbar{margin-top:-38px}.bbar form{grid-template-columns:1fr 1fr}.bbar .f:first-child,.bbar .f:nth-child(4){grid-column:1/-1}.bbar .f+.f{box-shadow:none}.bbar .f:nth-child(4){flex-direction:row;align-items:center;justify-content:space-between}.bbar .btn{grid-column:1/-1;min-height:54px}}

/* ===== sections ===== */
.sec{padding:110px 0}
.sec.tight{padding:76px 0}
.sec.sand{background:var(--sand)}
@media (max-width:760px){.sec{padding:72px 0}.sec.tight{padding:56px 0}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:68px;align-items:center}
.split>*{min-width:0}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:40px}}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:36px}

/* perks row */
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:56px}
.perks div{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r);background:var(--sand)}
.perks .ico{color:var(--gold-ink);width:26px;height:26px;margin-top:2px}
.perks b{display:block;font-size:.98rem}
.perks span{font-size:.86rem;color:var(--muted)}
@media (max-width:900px){.perks{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.perks{grid-template-columns:1fr}}

/* host */
.host{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.host .ph{aspect-ratio:4/5;border-radius:var(--r-lg)}
.hostcard{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;align-items:start}
.hostcard>div{display:flex;flex-direction:column;gap:2px;padding:16px 20px;border-right:1px solid var(--line);height:100%}
.hostcard>div:last-child{border-right:0}
.hostcard b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:400;line-height:1.1}
.hostcard span{font-size:.82rem;color:var(--muted)}
.facts-inline{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem;color:var(--ink-2)}
.facts-inline span{display:flex;align-items:center;gap:8px}
.facts-inline .ico{color:var(--gold-ink)}
.facts-inline .stars,.badge .stars{color:var(--gold)}
@media (max-width:900px){.host{grid-template-columns:1fr}.host .ph{aspect-ratio:4/3}}

/* unit cards */
.units-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media (max-width:900px){.units-grid{grid-template-columns:1fr}}
.ucard{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:box-shadow .3s,transform .3s}
.ucard:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.ucard .ph{border-radius:0;aspect-ratio:16/10}
.ucard .ph.zoom{transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.ucard:hover .ph.zoom{transform:scale(1.03)}
.ucard .pwrap{overflow:hidden;position:relative}
.ucard .meta{padding:22px 24px 24px;display:flex;flex-direction:column;gap:6px;flex:1}
.ucard h3{font-family:var(--display);font-weight:400;font-size:1.6rem}
.ucard .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-weight:600;color:var(--gold-ink)}
.ucard .badge{position:absolute;top:16px;left:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);white-space:nowrap}
.badge.sage{background:var(--sage-soft);color:var(--sage)}
.badge.navy{background:var(--navy-soft);color:var(--navy)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ink{background:var(--sand-2);color:var(--ink-2)}
.badge.light{background:rgba(255,253,249,.94);color:#1C2333}
:root[data-theme="dark"] .badge.navy{color:var(--navy-muted)}

/* tour */
.tour{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;align-items:start}
.tour>*{min-width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1px solid var(--line-2);background:var(--surface);padding:0 16px;min-height:42px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,color .2s}
.tab:hover{border-color:var(--gold)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;background:var(--sand-2)}
.stage .ph{position:absolute;inset:0;border-radius:0;cursor:zoom-in;border:0;padding:0;width:100%}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:92px;aspect-ratio:4/3;border-radius:var(--r-sm);border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;background:none;opacity:.7;transition:opacity .2s,border-color .2s}
.thumbs button .ph{width:100%;height:100%;border-radius:8px}
.thumbs button[aria-current="true"]{border-color:var(--gold);opacity:1}
.tourcopy h3{font-family:var(--display);font-weight:400;font-size:1.8rem;margin-bottom:12px}
.chk{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.chk li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}
.chk .ico{color:var(--sage);margin-top:2px}
@media (max-width:900px){.tour{grid-template-columns:1fr}}

/* band */
.band{display:grid;grid-template-columns:1fr 1fr;background:var(--navy);color:var(--navy-ink);border-radius:var(--r-lg);overflow:hidden}
.band .ph{border-radius:0;min-height:520px}
.band .in{padding:64px 60px}
.band h2{color:var(--navy-ink)}
.band .kicker{color:#D9BB84}
.ticks{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:18px}
.ticks li{display:grid;grid-template-columns:24px 1fr;gap:14px;color:var(--navy-muted)}
.ticks li b{color:var(--navy-ink);font-weight:600}
.ticks .ico{color:#D9BB84;width:22px;height:22px;stroke-width:2.2;margin-top:2px}
@media (max-width:900px){.band{grid-template-columns:1fr}.band .ph{min-height:280px}.band .in{padding:44px 24px}}

/* steps + pays */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;padding:0;list-style:none}
.steps li{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.steps .n{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);font-weight:700}
.steps h3{font-weight:600;font-size:1.05rem;margin:16px 0 6px}
.steps p{color:var(--muted);font-size:.94rem;margin:0}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.pays{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.pays .pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.94rem}
.pays .pill .ico{color:var(--gold-ink)}

/* reviews */
.rsum{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;padding:30px 34px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.rbig{text-align:center}
.rbig b{display:block;font-family:var(--display);font-weight:300;font-size:4.2rem;line-height:1}
.rbig .stars{display:flex;gap:3px;justify-content:center;color:var(--gold);margin:8px 0}
.rcats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 30px}
.rcat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;align-items:center}
.rcat i{grid-column:1/-1;height:4px;border-radius:4px;background:var(--sand-2);position:relative;overflow:hidden}
.rcat i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--gold);border-radius:4px}
.mentions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.mentions span{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.86rem}
.mentions b{color:var(--gold-ink);margin-left:4px}
@media (max-width:820px){.rsum{grid-template-columns:1fr;gap:24px}.rcats{grid-template-columns:1fr 1fr}}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:28px}
@media (max-width:820px){.rgrid{grid-template-columns:1fr}}
.rev{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rev .who{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#FFF;flex:none;font-size:.95rem}
.rev .who b{display:block}
.rev .who span{font-size:.82rem;color:var(--muted)}
.rev .who span.avatar{color:#fff;font-size:.92rem}
.rev .stars{display:flex;gap:2px;color:var(--gold)}
.rev p{margin:0;color:var(--ink-2)}
.reply{margin-top:4px;padding:14px 16px;border-radius:var(--r-sm);background:var(--sand);font-size:.92rem}
.reply b{display:block;font-size:.82rem;color:var(--gold-ink);margin-bottom:4px}
.src{font-size:.82rem;color:var(--muted);margin-top:16px}

/* location */
.loc{display:grid;grid-template-columns:1.15fr .85fr;gap:52px;align-items:start}
.loc .ph{aspect-ratio:4/3;border-radius:var(--r-lg)}
.near{list-style:none;padding:0;margin:22px 0 0}
.near li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.near li span:last-child{color:var(--gold-ink);font-weight:600;white-space:nowrap}
@media (max-width:900px){.loc{grid-template-columns:minmax(0,1fr)}}
.loc>*,.host>*,.units-grid>*,.know>*,.steps>*,.band>*,.perks>*{min-width:0}

/* gallery strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,30%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.strip button{scroll-snap-align:start;border:0;padding:0;cursor:zoom-in;aspect-ratio:4/3;background:none;border-radius:var(--r);overflow:hidden}
.strip .ph{width:100%;height:100%;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.strip button:hover .ph{transform:scale(1.04)}
.arrows{display:flex;gap:10px}
.arrows button{width:46px;height:46px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;border-radius:50%;color:var(--ink)}
.arrows button:hover{border-color:var(--gold);color:var(--gold-ink)}

/* know + faq */
.know{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.know>div{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.know h3{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:600;margin-bottom:12px}
.know h3 .ico{color:var(--gold-ink)}
.know ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:.94rem;color:var(--ink-2)}
@media (max-width:900px){.know{grid-template-columns:1fr}}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;font-weight:600;font-size:1.02rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .25s;color:var(--gold-ink)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq details>div{padding:0 0 20px;color:var(--ink-2);max-width:68ch;animation:fadein .35s ease}

/* cta */
.cta{border-radius:var(--r-lg);background:var(--gold-soft);padding:48px 52px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
@media (max-width:640px){.cta{padding:34px 24px}}

/* footer */
.ftr{background:var(--footer);color:#FBF9F5;margin-top:110px}
.ftr .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:40px;padding-top:72px;padding-bottom:56px}
.ftr h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin-bottom:18px;color:#FBF9F5}
.ftr a{text-decoration:none;color:#FBF9F5}
.ftr a:hover{text-decoration:underline}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ftr .ci{display:flex;align-items:center;gap:10px}
.ftr .soc{display:flex;gap:10px;margin-top:18px}
.ftr .soc a{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(255,253,248,.45);border-radius:50%}
.ftr .soc a:hover{background:rgba(255,253,248,.12);text-decoration:none}
.ftr .base{background:var(--footer-base);padding:18px 0;font-size:.88rem;color:#F5EFE3}
.ftr .base .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ftr .brand b,.ftr .brand span{color:#FBF9F5}
.themebtn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,253,248,.4);color:#FBF9F5;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.85rem;min-height:36px}
@media (max-width:900px){.ftr .cols{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ftr .cols{grid-template-columns:1fr}}

/* floating */
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:35;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab .chat{display:flex;align-items:center;gap:10px;background:var(--navy);color:#FBF9F5;border:0;border-radius:999px;padding:0 20px 0 16px;height:52px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(0,0,0,.5);font-weight:600}
.fab .top{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:var(--shadow-sm)}
.fab .top.show{opacity:1;pointer-events:auto}
.chatpop{position:absolute;right:0;bottom:64px;width:290px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;border-radius:var(--r);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .25s}
.chatpop.open{opacity:1;transform:none;pointer-events:auto}
.chatpop a{display:flex;align-items:center;gap:12px;padding:11px 10px;text-decoration:none;border-radius:var(--r-sm)}
.chatpop a:hover{background:var(--sand)}
.chatpop .ico{color:var(--gold-ink)}
@media (max-width:640px){.fab .chat{width:56px;height:56px;padding:0;justify-content:center;font-size:0;gap:0}.fab .chat .ico{width:24px;height:24px}}

/* ===== round 3: extra polish ===== */
.progress-bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:var(--gold);transform-origin:0 50%;transform:scaleX(0);z-index:90;pointer-events:none}
.hdr .wrap{transition:min-height .3s ease}
@media (min-width:1001px){.hdr.scrolled .wrap{min-height:64px}}
.kish{display:inline-block;width:56px;height:56px;border-radius:50%;background:#fff center/cover no-repeat;flex:none;box-shadow:0 0 0 3px var(--surface),0 4px 14px -6px rgba(0,0,0,.4)}
.kish.xs{width:22px;height:22px;box-shadow:none;vertical-align:-6px;margin-right:8px}
.reply b{display:flex;align-items:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3FA35B;margin-right:6px;box-shadow:0 0 0 0 rgba(63,163,91,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(63,163,91,0)}100%{box-shadow:0 0 0 0 rgba(63,163,91,0)}}
.chips-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chips-row .rating-chip{margin-top:0}
/* photo wipe reveal */
.rv .wipe,.rv.wipe{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.65,0,.35,1) .1s,transform 1.4s cubic-bezier(.16,1,.3,1)}
.rv.in .wipe,.rv.in.wipe{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.rv .wipe{clip-path:none}}
/* host art */
.hostart{position:relative}
.hostart>.ph{aspect-ratio:4/5;border-radius:var(--r-lg)}
.hostbadge{position:absolute;left:-18px;bottom:28px;display:flex;align-items:center;gap:14px;background:var(--surface);padding:12px 18px 12px 12px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 10px)}
.hostbadge b{display:block;font-size:.95rem}
.hostbadge span{font-size:.8rem;color:var(--muted)}
@media (max-width:900px){.hostart>.ph{aspect-ratio:4/3}.hostbadge{left:12px;bottom:12px}}
/* feature */
.feature{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
.feature>*{min-width:0}
.fcollage{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:220px 220px;gap:14px}
.fc{border:0;padding:0;background:none;cursor:zoom-in;border-radius:var(--r-lg);overflow:hidden;position:relative}
.fc .ph{width:100%;height:100%;border-radius:0;transition:clip-path 1.1s cubic-bezier(.65,0,.35,1) .1s,transform 1.2s cubic-bezier(.16,1,.3,1)}
.fc:hover .ph{transform:scale(1.04)}
.fc1{grid-row:1/3}
.ffacts{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ffacts div{padding:14px 16px;border-right:1px solid var(--line)}
.ffacts div:last-child{border:0}
.ffacts b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;line-height:1.1}
.ffacts span{font-size:.82rem;color:var(--muted)}
@media (max-width:900px){.feature{grid-template-columns:1fr;gap:36px}.fcollage{grid-template-rows:170px 170px}}
/* marquee */
.marquee{overflow:hidden;background:var(--navy);color:var(--navy-ink);padding:18px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;width:max-content;animation:marq 48s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.mgroup{display:flex;gap:44px;padding-right:44px}
.mgroup span{display:inline-flex;align-items:center;gap:12px;font-family:var(--display);font-size:1.3rem;font-weight:300;white-space:nowrap}
.mgroup .star{color:#D9BB84;width:14px;height:14px}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mtrack{animation:none}}
/* band parallax image */
.bandimg{overflow:hidden;position:relative;min-height:520px}
.bandimg .ph{position:absolute;inset:-6% 0;border-radius:0;transform:scale(1.12);will-change:transform}
@media (max-width:900px){.bandimg{min-height:300px}}
/* rating bars animate */
.rcat i::after{transform-origin:0 50%;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.16,1,.3,1) .2s}
.rv.in .rcat i::after,.rsum.in .rcat i::after{transform:scaleX(1)}
/* all photos */
.apsec{padding-top:26px}
.apsec h3{font-family:var(--display);font-weight:400;font-size:1.4rem}
.apgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.apgrid button{border:0;padding:0;background:none;cursor:zoom-in;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3}
.apgrid button:first-child:nth-last-child(odd){grid-column:1/-1;aspect-ratio:16/9}
.apgrid .ph{width:100%;height:100%;border-radius:0;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.apgrid button:hover .ph{transform:scale(1.03)}
/* mobile sticky bar */
.mbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:36;display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);transform:translateY(140%);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.mbar b{display:block;font-size:1.05rem}
.mbar .tiny{white-space:nowrap}
.mbar.show{transform:none}
@media (max-width:760px){.mbar{display:flex}.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}.fab .top{display:none}}
/* done check draw */
.seal svg{width:44px;height:44px}
.seal .sc{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .9s ease forwards}
.seal .sk{fill:none;stroke:var(--gold-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .7s ease forwards}
.seal{animation:pop .6s 1.1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
/* button sheen */
.btn:not(.ghost):not(.glass):not(.danger){position:relative;overflow:hidden}
.btn:not(.ghost):not(.glass):not(.danger)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);transition:left .7s ease;pointer-events:none}
.btn:not(.ghost):not(.glass):not(.danger):hover::after{left:130%}

/* ===== mobile tightening ===== */
.rev .more{display:none}
@media (max-width:760px){
  .sec{padding:56px 0}.sec.tight{padding:44px 0}
  .shead{margin-bottom:24px}
  .d2{font-size:clamp(1.7rem,7vw,2.1rem)}
  .lede{font-size:1rem}
  .perks{grid-template-columns:1fr 1fr;gap:10px;padding-top:40px}
  .perks div{flex-direction:column;gap:8px;padding:14px}
  .perks b{font-size:.92rem}.perks span{font-size:.8rem;line-height:1.4}
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:-18px;margin-right:-18px;padding:0 18px 6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none}
  .mentions{flex-wrap:nowrap;overflow-x:auto;margin-left:-18px;margin-right:-18px;padding:0 18px 6px;scrollbar-width:none}
  .mentions::-webkit-scrollbar{display:none}
  .mentions span{flex:none}
  .rsum{padding:22px}
  .rbig b{font-size:3.2rem}
  .rev{padding:18px}
  .rev p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .rev.open p{display:block;-webkit-line-clamp:unset}
  .rev .more{display:inline;align-self:flex-start;font-size:.88rem}
  .rev.open .more{display:none}
  .steps{gap:10px;margin-top:26px}
  .steps li{display:grid;grid-template-columns:38px 1fr;gap:4px 14px;padding:16px}
  .steps .n{grid-row:1/3}
  .steps h3{margin:6px 0 2px}
  .steps p{font-size:.9rem}
  .loc>div:first-child{order:2}
  .loc .ph{aspect-ratio:16/10}
  .loc{gap:28px}
  .know{gap:10px}.know>div{padding:18px}
  .band .in{padding:36px 22px}
  .ticks{gap:14px}
  .cta{padding:28px 22px}
  .ftr{margin-top:64px}
  .ftr .cols{grid-template-columns:1fr 1fr;gap:28px 20px;padding-top:48px;padding-bottom:36px}
  .ftr .cols>div:first-child,.ftr .cols>div:last-child{grid-column:1/-1}
  .hostcard b{font-size:1.4rem}.hostcard>div{padding:12px 14px}
  .ffacts b{font-size:1.3rem}.ffacts div{padding:10px 12px}
  .hero .lede{font-size:.98rem}
  .chips-row .rating-chip{font-size:.84rem;padding:7px 12px 7px 10px}
  /* unit page */
  .beds{grid-template-columns:1fr 1fr;gap:10px}
  .beds b{font-size:.92rem}
  .amen{grid-template-columns:1fr 1fr;gap:12px 14px;font-size:.9rem}
  .amen .ico{width:18px;height:18px}
  .usec{padding:28px 0}
  .ulayout{padding-top:24px}
  .mosaic{gap:6px}
  /* booking flow */
  .progress li{min-width:0;flex:none;padding-right:14px;font-size:.86rem}
  .progress li:not(.on) .lbl{display:none}
  .flow{padding-top:24px}

  .paybox{padding:18px;gap:18px}
  /* owner */
  .main{padding:20px 14px 90px}

/* ===== showcase extras ===== */
.ratebar{display:grid;grid-template-columns:repeat(4,1fr) auto;align-items:center;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 8px 8px 12px;gap:4px}

/* ===== map + pin pad ===== */

@media (max-width:760px){.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:260px 140px}.mosaic button:first-child{grid-column:1/-1;grid-row:auto}.mosaic button:nth-child(n+4){display:none}}

.ufacts{display:flex;flex-wrap:wrap;gap:10px 28px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0 30px}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-size:.82rem;color:var(--muted)}

const isHoliday = s => { const m = s.slice(5); return ["12-24", "12-25", "12-31", "01-01"].includes(m); };
function nightPrice(unitId, s) {
  const u = unitById(unitId);
  if (SPECIAL[unitId + "|" + s] != null) return { p: SPECIAL[unitId + "|" + s], kind: "special" };
  if (isHoliday(s)) return { p: u.holiday, kind: "holiday" };
  const d = parse(s).getDay();
  if (d === 5 || d === 6) return { p: u.weekend, kind: "weekend" };
  return { p: u.rate, kind: "weekday" };
}
function quote(unitId, a, b) {
  const u = unitById(unitId);
  if (!a || !b) return null;
  const n = diff(a, b); let sum = 0; const kinds = { weekday: [0, 0], weekend: [0, 0], holiday: [0, 0], special: [0, 0] };
  for (let i = 0; i < n; i++) { const { p, kind } = nightPrice(unitId, addDays(a, i)); sum += p; kinds[kind][0]++; kinds[kind][1] += p; }
  const pct = n >= 28 ? 25 : n >= 7 ? 10 : 0, disc = Math.round(sum * pct / 100);
  return { nights: n, sum, kinds, pct, disc, cleaning: u.cleaning, deposit: u.deposit, total: sum - disc + u.cleaning };
}

      <div class="hint">${ic("shield", "sm")}<span>Plus a ${peso(u.deposit)} refundable deposit, returned at check-out.</span></div>
    </div></aside>
  </div>`;
}
function allPhotosHTML() {
  return `<div class="mh"><h2>All photos of ${esc(UNITS[0].name)}</h2><button class="x" data-act="close" aria-label="Close">${ic("x")}</button></div>
  <div class="mb"><div class="tabs" style="margin-bottom:8px">${TOUR.map(t => `<button class="tab" data-act="jump" data-t="ap-${t.id}">${ic(t.icon, "sm")}${t.label}</button>`).join("")}</div>
  ${TOUR.map(t => `<section id="ap-${t.id}" class="apsec"><h3>${t.title}</h3><p class="muted small">${t.text}</p><div class="apgrid">${t.photos.map(p => `<button data-act="lightbox" data-set="all" data-i="${ALLPHOTOS.indexOf(p)}" aria-label="Open photo: ${esc(PHOTO_ALT[p])}">${photo(p, { thumb: 1 })}</button>`).join("")}</div></section>`).join("")}</div>`;
}

function mobileBar() {
  const u = UNITS[0];
  return `<div class="mbar" id="mbar"><div><b>${peso(u.rate)}</b><span class="tiny muted">a night, Sun to Thu</span></div><span class="mrow"><button class="btn sm" data-act="plan">${ic("chat", "sm")}Message to book</button></span></div>`;
}

/* ---------- CONTACT ---------- */
function contactPage() {
  return `<section class="phead"><div class="wrap"><div class="crumbs"><a href="#home">Home</a><span>/</span><span>Contact</span></div><h1 class="display d1">Say hi to Kish</h1><p class="lede" style="margin-top:14px">Questions, bookings, or help during your stay. Messenger is the fastest.</p></div></section>
  <section class="wrap split" style="padding-top:30px;padding-bottom:40px;align-items:start">
    <div><div class="cgrid big">${contactLinks()}</div>
      <div class="panel" style="margin-top:16px;display:flex;gap:14px;align-items:center">${KISH}<div><b>${HOST.name}</b><div class="small muted">${HOST.response}. Speaks ${HOST.langs}.</div></div></div></div>
    <div><h2 class="display d3" style="margin-bottom:18px">Plan your stay</h2>${planHTML(true)}</div>
  </section>`;
}
function notFound() { return `<div class="wrap done"><h1 class="display d2">That page isn't here</h1><p class="lede" style="margin-top:14px">The link may be old. Start from the home page.</p><a class="btn" href="#home">Go home</a></div>`; }

/* ---------- lightbox ---------- */
let LB = { list: ALLPHOTOS, i: 0 };
function lightbox() {
  const id = LB.list[LB.i];
  return `<div class="lb"><div class="lbstage">${photo(id, { cls: "fadeswap" })}</div>
  <div class="bar"><button data-act="lbNav" data-n="-1" aria-label="Previous photo">${ic("left")}</button><span class="small" style="text-align:center">${esc(PHOTO_ALT[id] || "")}<br><span style="opacity:.7">${LB.i + 1} of ${LB.list.length}</span></span><span style="display:flex;gap:8px"><button data-act="lbNav" data-n="1" aria-label="Next photo">${ic("right")}</button><button data-act="close" aria-label="Close">${ic("x")}</button></span></div></div>`;
}
/* ---------- router ---------- */
const HOME_IDS = ["home", "location", "goodtoknow", "reviews", "home2-tour", "homes", "host", "plan", "payment"];
function route() { return (location.hash || "#home").slice(1) || "home"; }
function render(keepScroll) {
  let r = route(); const app = $("#app");
  if (r === "avail") { r = "unit-" + UNITS[0].id; pendingAnchor = "avail"; }
  let body;
  if (HOME_IDS.includes(r)) body = home();
  else if (r === "units" || r === "book" || r === "track" || r.startsWith("owner")) { location.replace(r === "units" ? "#unit-" + UNITS[0].id : "#plan"); return; }
  else if (r.startsWith("unit-")) body = unitPage(r.slice(5));
  else if (r === "contact") body = contactPage();
  else body = notFound();
  app.innerHTML = `<div class="progress-bar" id="pbar"></div>` + ribbon() + header(r) + `<main id="main">${body}</main>` + footer() + (r === "contact" ? "" : mobileBar());
  document.title = (r.startsWith("unit-") ? ((unitById(r.slice(5)) || {}).name || "Home") + ", " : r === "contact" ? "Contact, " : "") + "Home by Kish, Cagayan de Oro";
  setupReveal(keepScroll);
  requestAnimationFrame(onScroll);
  if (pendingAnchor) { const id = pendingAnchor; pendingAnchor = null; setTimeout(() => { const el = document.getElementById(id); el && el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 250); return; }
  if (HOME_IDS.includes(r) && r !== "home") { requestAnimationFrame(() => { const el = document.getElementById(r); el && el.scrollIntoView(); }); return; }
  if (!keepScroll) window.scrollTo({ top: 0, behavior: "instant" });
}
function rerender() { const y = window.scrollY; render(true); window.scrollTo({ top: y, behavior: "instant" }); }
function go() { const app = $("#app"); app.classList.add("leaving"); setTimeout(() => { render(); app.classList.remove("leaving"); }, 180); }

/* ---------- motion ---------- */
let revObs = null;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec || 0), t0 = performance.now(), dur = 1300;
  if (reduced()) { el.textContent = to.toFixed(dec); return; }
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setupReveal(instant) {
  revObs && revObs.disconnect();
  const els = $$(".rv"), counts = $$(".count");
  if (instant || !("IntersectionObserver" in window) || reduced()) { els.forEach(e => e.classList.add("in")); return; }
  counts.forEach(c => { c.textContent = (0).toFixed(+(c.dataset.dec || 0)); });
  const cObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { countUp(e.target); cObs.unobserve(e.target); } }), { threshold: .6 });
  counts.forEach(c => cObs.observe(c));
  revObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); revObs.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: .08 });
  els.forEach(e => revObs.observe(e));
}
function setSlide(i) { const s = $$(".slide"); if (!s.length) return; S.slide = (i + s.length) % s.length; s.forEach((x, k) => x.classList.toggle("on", k === S.slide)); $$(".sdots button").forEach((b, k) => b.setAttribute("aria-current", k === S.slide)); }

/* ---------- plan your stay ---------- */
function refreshPlan() {
  const t = $("#p-text"), e = $("#p-est"), o = $("#p-out");
  if (t) t.textContent = planMessage();
  if (e) e.innerHTML = estHTML(planEstimate());
  if (o) o.min = S.plan.in || TODAY;
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (err) { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok; }
}

/* ---------- actions ---------- */
const A = {
  pkg: () => openPkg(),
  pkgGo: el => {
    const t = el.dataset.to; closeModal();
    if (route() === t || (t === "home" && route() === "home")) { const id = t === "home" ? null : t; if (id && document.getElementById(id)) document.getElementById(id).scrollIntoView({ behavior: "smooth" }); else window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    location.hash = "#" + t;
  },
  close: closeModal,
  demo: el => { $("#chatpop") && $("#chatpop").classList.remove("open"); demoNote(el.dataset.w || "Done"); },
  menu: () => { const m = $("#mnav"), o = !m.classList.contains("open"); m.classList.toggle("open", o); $$('[data-act="menu"]').forEach(b => b.setAttribute("aria-expanded", o)); document.body.style.overflow = o ? "hidden" : ""; },
  chat: () => { const p = $("#chatpop"), o = !p.classList.contains("open"); p.classList.toggle("open", o); $(".fab .chat").setAttribute("aria-expanded", o); },
  top: () => window.scrollTo({ top: 0, behavior: "smooth" }),
  theme: () => { const d = document.documentElement, dark = d.dataset.theme !== "dark"; d.dataset.theme = dark ? "dark" : "light"; rerender(); toast(dark ? "Dark mode on" : "Light mode on", "Colours can be changed in one place later."); },
  slide: el => setSlide(+el.dataset.i),
  moreRev: el => { const c = !!el.dataset.c; if (c) S.revAllU = true; else S.revAll = true; const box = $(c ? "#ureviews" : "#reviews"); box.innerHTML = (c ? "<h2>Guest reviews</h2>" : "") + reviewsHTML(c); box.querySelectorAll(".rv").forEach(e => e.classList.add("in")); box.querySelectorAll(".rev").forEach((e, i) => { if (i >= (c ? 3 : 4)) e.classList.add("fadeswap"); }); },
  readMore: el => el.closest(".rev").classList.add("open"),
  strip: el => { const s = $("#strip"); s.scrollBy({ left: +el.dataset.n * s.clientWidth * .8, behavior: "smooth" }); },
  lightbox: el => { LB.list = el.dataset.set === "tour" ? TOUR.find(t => t.id === S.tour).photos : ALLPHOTOS; LB.i = +el.dataset.i || 0; const was = $("#scrim").classList.contains("open"); if (was) closeModal(); setTimeout(() => { openModal(lightbox(), { label: "Photo viewer" }); $("#scrim .modal").style.background = "transparent"; $("#scrim .modal").style.boxShadow = "none"; }, was ? 260 : 0); },
  lbNav: el => { LB.i = (LB.i + +el.dataset.n + LB.list.length) % LB.list.length; setModal(lightbox()); },
  share: () => demoNote("Link copied"),
  scrollTo: el => { const t = document.getElementById(el.dataset.t); t && t.scrollIntoView({ behavior: "smooth" }); },
  allPhotos: () => openModal(allPhotosHTML(), { label: "All photos" }),
  jump: el => { const t = document.getElementById(el.dataset.t); t && t.scrollIntoView({ behavior: "smooth", block: "start" }); },
  plan: () => {
    $("#mnav") && $("#mnav").classList.remove("open"); document.body.style.overflow = "";
    const inline = $(".plan:not(.inmodal)") || $(".plan");
    if (inline) { (document.getElementById("plan") || inline).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    openModal(`<div class="mh"><h2>Plan your stay</h2><button class="x" data-act="close" aria-label="Close">${ic("x")}</button></div><div class="mb">${planHTML(true)}</div>`, { label: "Plan your stay" });
  },
  pguests: el => { S.plan.guests = Math.max(1, Math.min(UNITS[0].guests, S.plan.guests + +el.dataset.n)); const box = el.closest(".plan"); const fresh = document.createElement("div"); fresh.innerHTML = planHTML(box.classList.contains("inmodal")); box.replaceWith(fresh.firstElementChild); },
  copyPlan: async () => { const ok = await copyText(planMessage()); toast(ok ? "Message copied" : "Couldn't copy", ok ? "Paste it into Messenger, a text or an email to Kish." : "Select the message and copy it yourself.", ok ? "check" : "alert"); },
  sendPlan: async el => { await copyText(planMessage()); toast(`Opening ${el.dataset.via}`, "Demo only. On the live site this opens " + el.dataset.via + " with your message ready to send. It's also copied for you.", "info"); }
};

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && A[el.dataset.act]) { if (el.tagName === "A") e.preventDefault(); A[el.dataset.act](el, e); return; }
  if (e.target.id === "scrim") closeModal();
  const pop = $("#chatpop"); if (pop && pop.classList.contains("open") && !e.target.closest(".fab")) A.chat();
  if (e.target.closest(".mnav a.item")) { $("#mnav").classList.remove("open"); document.body.style.overflow = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#scrim").classList.contains("open")) closeModal(); else if ($("#mnav") && $("#mnav").classList.contains("open")) A.menu(); else if ($("#chatpop") && $("#chatpop").classList.contains("open")) A.chat(); }
  if ($("#scrim .lb") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { LB.i = (LB.i + (e.key === "ArrowRight" ? 1 : -1) + LB.list.length) % LB.list.length; setModal(lightbox()); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset.plan; if (!k) return;
  S.plan[k] = e.target.value;
  if (k === "in" && S.plan.out && S.plan.out <= S.plan.in) { S.plan.out = ""; const o = $("#p-out"); if (o) o.value = ""; }
  refreshPlan();
});
let ticking = false;
function onScroll() {
  ticking = false;
  const y = window.scrollY, h = $("#hdr"), t = $("#totop"), pb = $("#pbar"), mb = $("#mbar");
  h && h.classList.toggle("scrolled", y > 10);
  t && t.classList.toggle("show", y > 700);
  if (pb) { const max = document.documentElement.scrollHeight - innerHeight; pb.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`; }
  if (mb) { const anchor = $(".bbar") || $("#bcard"), plan = $("#plan"); let show = y > 420; if (anchor && show) { const r = anchor.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) show = false; } let planVis = false; if (plan) { const r = plan.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) { show = false; planVis = true; } } const on = show && !$("#scrim").classList.contains("open"); mb.classList.toggle("show", on); document.body.classList.toggle("mbar-on", on || planVis); }
  if (!reduced() && innerWidth > 900) $$(".para").forEach(p => { const r = p.parentElement.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; p.style.transform = `translateY(${((r.top + r.height / 2 - innerHeight / 2) * -0.08).toFixed(1)}px) scale(1.12)`; });
}
window.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
window.addEventListener("resize", () => requestAnimationFrame(onScroll));
window.addEventListener("hashchange", () => { if ($("#scrim").classList.contains("open")) closeModal(); const r = route(); if (HOME_IDS.includes(r) && $(".hero")) { const el = document.getElementById(r); if (el && r !== "home") { el.scrollIntoView({ behavior: "smooth" }); return; } if (r === "home") { window.scrollTo({ top: 0, behavior: "smooth" }); return; } } go(); });
let sx = null;
document.addEventListener("touchstart", e => { if (e.target.closest(".lb")) sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (sx == null || !$("#scrim .lb")) { sx = null; return; } const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 45) { LB.i = (LB.i + (dx < 0 ? 1 : -1) + LB.list.length) % LB.list.length; setModal(lightbox()); } }, { passive: true });
setInterval(() => { if ($(".hero") && !document.hidden && !reduced()) setSlide(S.slide + 1); }, 6500);
setInterval(() => { const c = $("#cdotime"); if (c) c.textContent = cdoTime(); }, 20000);

render();
showPkgOnce();

function showPkgOnce() {
  const r = route();
  if (r !== "home") return;
  let seen = false; try { seen = sessionStorage.getItem("hbk-versions-seen") === "1"; } catch (e) {}
  if (seen) return;
  setTimeout(() => { if (!$("#scrim").classList.contains("open")) openPkg(); try { sessionStorage.setItem("hbk-versions-seen", "1"); } catch (e) {} }, 700);
}
/* ---------- shared extras: photo tour arrows/swipe, lazy photos ---------- */
function tourRender(dir) {
  const box = $("#home2-tour"); if (!box) return;
  box.innerHTML = tourHTML();
  box.querySelectorAll(".rv").forEach(e => e.classList.add("in"));
  const stage = box.querySelector(".stage .ph"); if (stage && dir) stage.classList.add(dir > 0 ? "from-r" : "from-l");
  const tabs = box.querySelector(".tabs"), on = box.querySelector('.tab[aria-selected="true"]');
  if (tabs && on) tabs.scrollTo({ left: on.offsetLeft - 24, behavior: "smooth" });
}
Object.assign(A, {
  tour: el => { S.tour = el.dataset.t; S.tourI = 0; tourRender(0); },
  tourPic: el => { const n = +el.dataset.i; const d = n > S.tourI ? 1 : -1; S.tourI = n; tourRender(d); },
  tourNav: el => {
    const n = +el.dataset.n, ti = TOUR.findIndex(t => t.id === S.tour), t = TOUR[ti];
    let i = S.tourI + n;
    if (i >= t.photos.length) { const nt = TOUR[(ti + 1) % TOUR.length]; S.tour = nt.id; i = 0; }
    else if (i < 0) { const pt = TOUR[(ti - 1 + TOUR.length) % TOUR.length]; S.tour = pt.id; i = pt.photos.length - 1; }
    S.tourI = i; tourRender(n);
  }
});
/* swipe the tour photo on phones */
let tsx = null, tsy = null;
document.addEventListener("touchstart", e => { const st = e.target.closest('[data-swipe="tour"]'); if (st) { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; } }, { passive: true });
document.addEventListener("touchend", e => {
  if (tsx == null) return; const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy; tsx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { A.tourNav({ dataset: { n: dx < 0 ? 1 : -1 } }); swipeDone = true; setTimeout(() => swipeDone = false, 400); }
}, { passive: true });
let swipeDone = false;
document.addEventListener("click", e => { if (swipeDone && e.target.closest('[data-swipe="tour"]')) { e.stopPropagation(); e.preventDefault(); } }, true);
/* arrow keys move the tour when it's on screen and no popup is open */
document.addEventListener("keydown", e => {
  if ($("#scrim") && $("#scrim").classList.contains("open")) return;
  if (!["ArrowLeft", "ArrowRight"].includes(e.key) || /input|textarea|select/i.test(document.activeElement.tagName)) return;
  const st = $("#tourbox"); if (!st) return; const r = st.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
  A.tourNav({ dataset: { n: e.key === "ArrowRight" ? 1 : -1 } });
});
/* lazy photos: only download what's near the screen */
const lzObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("vis"); lzObs.unobserve(en.target); } }), { rootMargin: "600px 400px" }) : null;
function lzScan(root) { (root || document).querySelectorAll(".lz:not(.vis)").forEach(el => lzObs ? lzObs.observe(el) : el.classList.add("vis")); }
new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { if (n.classList.contains("lz")) lzScan(n.parentNode); else lzScan(n); } }).observe(document.body, { childList: true, subtree: true });
lzScan();

/* ---------- booking-only helpers (safe no-ops in the showcase) ---------- */
async function copyTxt(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (err) { const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok; }
}
if (typeof QUICK !== "undefined") A.quick = async el => { const b = BOOKINGS.find(x => x.ref === el.dataset.ref), q = QUICK[+el.dataset.i], ok = await copyTxt(q[2](b)); toast(ok ? "Message copied" : "Couldn't copy", ok ? "Paste it into Messenger or a text to " + b.guest.split(" ")[0] + "." : "Try again.", ok ? "check" : "alert"); };
document.addEventListener("change", e => { const x = e.target.dataset && e.target.dataset.extra; if (!x || typeof S.guest === "undefined") return; const set = new Set(S.guest.extras); e.target.checked ? set.add(x) : set.delete(x); S.guest.extras = [...set]; });

/* ---------- map: live Google Map on the real site, a stand-in on the demo link ---------- */
function mapHTML() {
  const q = encodeURIComponent(PLACE.q), open = `https://www.google.com/maps/search/?api=1&query=${q}`, dir = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
  const map = MAP_EMBED
    ? `<iframe title="Map showing ${esc(PLACE.name)}" src="https://www.google.com/maps?q=${q}&z=15&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`
    : `<div class="mapfake"><div class="pin"><span></span></div><b>${esc(PLACE.name)}</b><small>The live Google Map shows here on the real website. Tap the buttons below to open it now.</small></div>`;
  return `<div class="mapbox">${map}<div class="mapbar"><div><b>${esc(PLACE.name)}</b><span>${esc(PLACE.street)}</span></div><div class="mbtns"><a class="btn ghost sm" href="${open}" target="_blank" rel="noopener">${ic("pin", "sm")}Open map</a><a class="btn sm" href="${dir}" target="_blank" rel="noopener">${ic("send", "sm")}Directions</a></div></div></div>`;
}
